<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>agent-world — the text view</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root { color-scheme: dark; }
  body {
    margin: 0; padding: 18px 20px 30px;
    background: #121417; color: #d8d3c8;
    font: 13px/1.35 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  h1 { font-size: 14px; font-weight: 600; letter-spacing: .06em;
       text-transform: uppercase; color: #9aa3ad; margin: 0 0 4px; }
  .sub { color: #7d8590; font-size: 12px; margin-bottom: 14px; }
  .sub a { color: #7fb2ff; }
  pre {
    margin: 0; padding: 14px 16px; white-space: pre; overflow-x: auto;
    background: #0c0e10; border: 1px solid #23272d; border-radius: 6px;
    color: #cfd3d6; line-height: 1.25;
  }
  .legend { margin-top: 12px; color: #6e7681; font-size: 11.5px; }
  .legend span { margin-right: 12px; white-space: nowrap; }
</style>
</head>
<body>
<h1>agent-world — the text view</h1>
<div class="sub">
  One builder's perspective, projected by an integer kernel.
  <a href="/">the 3D view</a> &middot; <a href="/voices">the voices</a> &middot; <a href="/status">the status</a>
</div>
<pre id="frame">waiting for the world&hellip;</pre>
<div class="legend">
  <span># stone</span><span>. dirt</span><span>" grass</span><span>T log</span>
  <span>t leaves</span><span>H planks</span><span>C chest</span>
  <span>w wheat</span><span>, grass</span><span>~ water</span><span>! lava</span>
</div>
<script>
  // The frame is fetched, not streamed: the kernel is integer and
  // deterministic, so the same world state always gives the same text.
  const target = document.getElementById('frame');
  async function tick () {
    try {
      const response = await fetch('/ascii/frame?width=110&height=32', { cache: 'no-store' });
      target.textContent = await response.text();
    } catch (err) {
      target.textContent = '(the view lost the world for a moment)';
    }
  }
  tick();
  setInterval(tick, 700);
</script>
</body>
</html>
